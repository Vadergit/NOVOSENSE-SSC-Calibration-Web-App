name: Compile adapter firmware
on: [push, pull_request]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: arduino:avr
            fqbn: arduino:avr:leonardo
            url: ''
          - core: esp32:esp32
            fqbn: esp32:esp32:esp32c3
            url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core
        env:
          CORE: ${{ matrix.core }}
          INDEX: ${{ matrix.url }}
        run: |
          if [ -n "$INDEX" ]; then arduino-cli config init; arduino-cli config add board_manager.additional_urls "$INDEX"; fi
          arduino-cli core update-index
          arduino-cli core install "$CORE"
      - name: Compile
        env:
          FQBN: ${{ matrix.fqbn }}
        run: arduino-cli compile --fqbn "$FQBN" firmware/novo_i2c
